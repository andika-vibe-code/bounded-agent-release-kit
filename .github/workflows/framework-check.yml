name: Framework checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-and-template-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh
      - run: test -f README.md && test -f framework.env.example
      - name: Reject credential and application-specific markers
        run: |
          if rg -n 'AIza|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"(private_key|private_key_id|client_email|client_secret)"[[:space:]]*:' . --glob '!README.md'; then
            echo 'Potential credential marker found in the public framework.' >&2
            exit 1
          fi

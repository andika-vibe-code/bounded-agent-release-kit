name: Bug report
description: Report a reproducible problem in the framework
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, private application source, or copied model transcripts.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, sanitized configuration, and relevant output.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Flutter version, Android tooling version, and framework commit/tag.
    validations:
      required: true
